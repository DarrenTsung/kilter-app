app = "kilter-darrent"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[env]
  BACKUP_DIR = "/data/backups"
  NODE_ENV = "production"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "15s"
    interval = "15s"
    method = "GET"
    timeout = "5s"
    path = "/"

[[mounts]]
  source = "kilter_backups"
  destination = "/data"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"
